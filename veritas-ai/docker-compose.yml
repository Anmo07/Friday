version: '3.8'

services:
  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: veritas-backend
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j-db:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=veritas_secure
      # Automatically map to Host Ollama natively if ran locally (host.docker.internal works securely)
      - OLLAMA_HOST=http://host.docker.internal:11434
    depends_on:
      - neo4j-db
    networks:
      - veritas-network
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: veritas-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws/stream
    networks:
      - veritas-network
    depends_on:
      - backend

  neo4j-db:
    image: neo4j:5.21.0
    container_name: neo4j-knowledge-graph
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=neo4j/veritas_secure
    volumes:
      - neo4j_data:/data
    networks:
      - veritas-network

networks:
  veritas-network:
    driver: bridge

volumes:
  neo4j_data:
    driver: local
