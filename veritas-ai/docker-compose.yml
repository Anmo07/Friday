services:
  # =============================================
  # Backend — FastAPI + CrewAI + Friday System
  # =============================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: veritas-backend
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - NEO4J_URI=bolt://neo4j-db:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=veritas_secure
      - OLLAMA_BASE_URL=http://ollama:11434
      - CHROMA_PERSIST_DIRECTORY=/app/chroma_db
      - PUBLIC_API_BASE_URL=http://localhost:8001/api/v1
      - PUBLIC_WS_BASE_URL=ws://localhost:8001/ws/stream
    depends_on:
      neo4j-db:
        condition: service_healthy
      chromadb:
        condition: service_started
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - veritas-network
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # =============================================
  # Frontend — Next.js Production Dashboard
  # =============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8001
        NEXT_PUBLIC_WS_BASE_URL: ws://localhost:8001/ws/stream
    container_name: veritas-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - veritas-network
    depends_on:
      backend:
        condition: service_healthy

  # =============================================
  # Neo4j — Knowledge Graph Database
  # =============================================
  neo4j-db:
    image: neo4j:5.21.0
    container_name: veritas-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/veritas_secure
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - veritas-network
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p veritas_secure 'RETURN 1' || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5

  # =============================================
  # ChromaDB — Vector Database for RAG
  # =============================================
  chromadb:
    image: chromadb/chroma:latest
    container_name: veritas-chromadb
    restart: unless-stopped
    ports:
      - "8200:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - veritas-network

  redis:
    image: redis:7-alpine
    container_name: veritas-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - veritas-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: veritas-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - veritas-network

networks:
  veritas-network:
    driver: bridge

volumes:
  backend_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  chroma_data:
    driver: local
  redis_data:
    driver: local
  ollama_data:
    driver: local
