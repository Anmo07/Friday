version: '3.8'

services:
  # =============================================
  # Backend — FastAPI + CrewAI + Friday System
  # =============================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: veritas-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j-db:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=veritas_secure
      - OLLAMA_HOST=http://host.docker.internal:11434
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8200
    depends_on:
      neo4j-db:
        condition: service_healthy
      chromadb:
        condition: service_started
    networks:
      - veritas-network
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # =============================================
  # Frontend — Next.js Production Dashboard
  # =============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws/stream
    container_name: veritas-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - veritas-network
    depends_on:
      backend:
        condition: service_healthy

  # =============================================
  # Neo4j — Knowledge Graph Database
  # =============================================
  neo4j-db:
    image: neo4j:5.21.0
    container_name: veritas-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/veritas_secure
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - veritas-network
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p veritas_secure 'RETURN 1' || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5

  # =============================================
  # ChromaDB — Vector Database for RAG
  # =============================================
  chromadb:
    image: chromadb/chroma:latest
    container_name: veritas-chromadb
    restart: unless-stopped
    ports:
      - "8200:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - veritas-network

networks:
  veritas-network:
    driver: bridge

volumes:
  backend_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  chroma_data:
    driver: local
