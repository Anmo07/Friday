moe_router:
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  threshold_confidence: 0.75
  
tiers:
  tier_1_fast:
    description: "Direct OS/Local operations. No RAG."
    model: "phi3:mini"
    ollama_config:
      num_ctx: 2048
      num_thread: 8
      f16_kv: true      # Apple Silicon Metal-optimized KV cache
      keep_alive: "10m" # Keep fast router model warm in RAM
      
  tier_2_standard:
    description: "Vector-only RAG for factual lookup."
    model: "llama3.1:8b-instruct"
    ollama_config:
      num_ctx: 4096
      num_thread: 8
      f16_kv: true
      keep_alive: "5m"
      
  tier_3_deep:
    description: "Full Hybrid RAG (Graph + Vector) + Multi-agent verification."
    # Llama 3.1 8B-Instruct replaces Mixtral 8x7B.
    # Rationale: 128K context window, fits in 8-16GB Unified Memory at Q4,
    # avoids the catastrophic disk swapping Mixtral causes on M2 Air.
    model: "llama3.1:8b-instruct"
    ollama_config:
      num_ctx: 8192
      num_thread: 8
      f16_kv: true
      keep_alive: "5m"  # Keep warm — same model as T2, shared KV cache
