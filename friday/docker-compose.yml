services:
  # =============================================
  # Backend — FastAPI + Friday AI System
  # =============================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: friday-backend
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - NEO4J_URI=bolt://neo4j-db:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-friday_secure}
      - OLLAMA_BASE_URL=http://ollama:11434  
      - MODEL_NAME=phi3
      - FAST_MODEL=mistral
      - ROUTER_MODEL=phi3
      - RETRIEVAL_K=3
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CHROMA_PERSIST_DIRECTORY=/app/chroma_db
      - PUBLIC_API_BASE_URL=http://localhost:8001/api/v1
      - PUBLIC_WS_BASE_URL=ws://localhost:8001/ws/stream
      - PIPELINE_TIMEOUT_SECONDS=120
      - AGENT_TASK_TIMEOUT_SECONDS=60
    depends_on:
      neo4j-db:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - friday-network
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # =============================================
  # Frontend — Next.js Production Dashboard
  # =============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8001
        NEXT_PUBLIC_WS_BASE_URL: ws://localhost:8001/ws/stream
    container_name: friday-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - friday-network
    depends_on:
      backend:
        condition: service_healthy

  # =============================================
  # Neo4j — Knowledge Graph Database
  # =============================================
  neo4j-db:
    image: neo4j:5.21.0
    container_name: friday-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-friday_secure}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - friday-network
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_PASSWORD:-friday_secure}\" 'RETURN 1' || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5

  # =============================================
  # ChromaDB — Vector Database for RAG
  # =============================================
  chromadb:
    image: chromadb/chroma:0.5.5
    container_name: friday-chromadb
    restart: unless-stopped
    ports:
      - "127.0.0.1:8200:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - friday-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: friday-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - friday-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:0.3.12
    container_name: friday-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - friday-network
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  friday-network:
    driver: bridge

volumes:
  backend_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  chroma_data:
    driver: local
  redis_data:
    driver: local
  ollama_data:
    driver: local
