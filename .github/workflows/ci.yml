name: CI Pipeline\n\non:\n  push:\n    branches: [ main, develop ]\n  pull_request:\n    branches: [ main ]\n\njobs:\n  build-and-test:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Checkout code\n        uses: actions/checkout@v4\n\n      # --- Setup Python Environment (for Backend Tests) ---\n      - name: Set up Python\n        uses: actions/setup-python@v5\n        with:\n          python-version: '3.11'\n          cache: 'pip'\n\n      - name: Install Backend Dependencies\n        run: |
          # Assuming a requirements.txt exists in the backend directory\n          pip install -r veritas-ai/requirements.txt\n\n      - name: Run Backend Tests\n        run: |
          python -m pytest veritas-ai/tests\n\n      # --- Setup Node.js Environment (for Frontend Build) ---\n      - name: Set up Node.js\n        uses: actions/setup-node@v4\n        with:\n          node-version: '20'\n          cache: 'npm'\n\n      - name: Install Frontend Dependencies\n        run: |
          npm install --prefix veritas-ai/frontend\n\n      - name: Build Frontend\n        run: |
          npm run build --prefix veritas-ai/frontend\n\n      # NOTE: Docker build should be done separately or as a dedicated job \n      # if the CI runner has the necessary Docker service access.
      - name: Docker Build (Optional Step)\n        run: echo "Manual Docker build step required: docker-compose build"