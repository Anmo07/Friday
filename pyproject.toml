[project]
name = "friday"
version = "0.2.0"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "crewai>=1.0.0",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-openai>=0.1.0",
    "chromadb>=0.5.0",
    "playwright>=1.44.0",
    "neo4j>=5.19.0",
    "redis>=5.0.0",
    "cachetools>=6.2.6",
    "requests>=2.31.0",
    "feedparser>=6.0.11",
    "aiohttp>=3.9.0",
    "websockets>=12.0",
    "numpy>=1.24.0",
    "faster-whisper>=1.0.0",
    "edge-tts>=6.1.13",
    "sounddevice>=0.4.6",
    "slowapi>=0.1.9",
    "rumps>=0.4.0",
    "rich>=13.7.0",
    "semantic-router>=0.1.0",
    "build>=1.0.0",
    "funasr>=1.1.0",
    "torch>=2.0.0",
    "modelscope>=1.10.0",
    "httpx>=0.27.0",
]

[project.scripts]
friday = "friday.menubar:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["friday*"]

[tool.pyrefly]
search_path = ["friday"]

[dependency-groups]
dev = [
    "types-setuptools>=81.0.0.20260209",
]
