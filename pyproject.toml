[project]
name = "friday"
version = "0.2.0"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "crewai==0.1.32",
    "langchain>=0.1.0",
    "langchain-community>=0.0.10",
    "chromadb>=0.4.0",
    "playwright==1.44.0",
    "neo4j>=5.19.0",
    "redis>=5.0.0",
    "cachetools>=6.2.6",
    "requests>=2.31.0",
    "feedparser>=6.0.11",
    "aiohttp>=3.9.0",
    "websockets>=12.0",
    "numpy>=1.24.0",
    "faster-whisper>=1.0.0",
    "edge-tts>=6.1.13",
    "sounddevice>=0.4.6",
    "slowapi>=0.1.9",
]

[project.scripts]
friday = "friday.cli:main"

[tool.setuptools]
package-dir = {"" = "friday"}

[tool.setuptools.packages.find]
where = ["friday"]
include = ["*"]

[tool.pyrefly]
search_path = ["friday"]

[dependency-groups]
dev = [
    "types-setuptools>=81.0.0.20260209",
]
