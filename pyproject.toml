[project]
name = "friday"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "crewai==0.1.32",
    "langchain>=0.1.0",
    "chromadb>=0.4.0",
    "playwright==1.44.0",
    "neo4j>=5.19.0",
    "redis>=5.0.0"
]

[tool.setuptools]
package-dir = {"" = "veritas-ai"}
packages = ["api", "core", "agents", "pipelines", "models", "tools", "memory", "config", "feedback"]

